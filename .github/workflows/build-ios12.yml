name: Build Flo (iOS 12)

# Builds an unsigned .ipa for the Flo iOS 12 video app.
# Download the artifact, then sideload it onto the iPad (e.g. with Sideloadly)
# using a free Apple ID.

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/ios12-video/**"
      - ".github/workflows/build-ios12.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/ios12-video

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 16 raised the minimum deployment target above iOS 12, so we pin
      # to Xcode 15.4 which can still target iOS 12.0.
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project Flo.xcodeproj \
            -scheme Flo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Flo.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty || xcodebuild \
            -project Flo.xcodeproj \
            -scheme Flo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Flo.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/Flo.xcarchive/Products/Applications/Flo.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Flo.app not found at $APP_PATH"
            ls -R build/Flo.xcarchive/Products || true
            exit 1
          fi
          rm -rf build/Payload build/Flo.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry Flo.ipa Payload)
          echo "Built unsigned IPA:"
          ls -lh build/Flo.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flo-unsigned-ipa
          path: apps/ios12-video/build/Flo.ipa
          if-no-files-found: error
          retention-days: 14
